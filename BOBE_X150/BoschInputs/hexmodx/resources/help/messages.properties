MSG_HELP_INFO=\noptions:\n\tConfigHexMod\n\n \tmerge/checksum functionality\n\t--core_exp=<filename> filename of the file list of the XML input data.\n\t--core_exp_xml=<filename> filename of merged XML input data.\n\t-in_t=<filename> filename of the template for output file [-in].\n\t-in=<filename> output file (i.e. input.xml).\n\t-rule_t=<filename> filename of the template for output file [-rule].\n\t-rule=<filename> output file (i.e. rules.xml).\n\t-out_t=<filename> filename of the template for output file [-out].\n\t-out=<filename> output file (i.e. output.xml).\n\t-info_t=<filename> filename of the template for output file [-info].\n\t-info=<filename> output file (i.e. infoblock.xml).\n\t-abm=<filename> filename of the abm file.\n\t-all_hex=<filename> filename of the file list containing all hex files.\n\t-prj_hex=<filename> filename of the project hexfile.\n\t-hex=<filename> filename of the output hex file for Hexmod17.\n\t-hexmod_log=<filename> logfile for Hexmod17.\n\t-hexmod_precks_log=<filename> logfile for debug mode of Hexmod17.\n\t-hexmod_preib_log=<filename> logfile for debug mode of Hexmod17.\n\t-hexmod_postcks_log=<filename> logfile for debug mode of Hexmod17.\n\t-hexmod_postib_log=<filename> logfile for debug mode of Hexmod17.\n\t-logfile=<filename>  logfile for ConfigHexMod.\n\t-?  Copyright information\n\t-ver  version information\n\n\tcleanup functionality\n\t-core_exp=<filename> filename of the file list of the XML input data.\n\t-core_exp_xml=<filename> filename of merged XML input data.\n\t-in_t=<filename> filename of the template for output file [-in].\n\t-cleanin=<filename> output file (i.e input_clean.xml).\n\t-rule_t=<filename> filename of the template for output file [-rule].\n\t-cleanrule=<filename> output file (i.e. rules_clean.xml).\n\t-out_t=<filename> filename of the template for output file [-out].\n\t-clean_out = <filename> output file (i.e. output_clean.xml).\n\t-clean_t = <filename> filename of the template for output file [-clean].\n\t-clean = <filename> output file (i.e. clean.xml).\n\t-hex = <filename> filename for input hex file to be cleaned by HexMod17.\n\t-cleanhex = <filename> filename for output cleaned hex file.\n\t-hexmod_log = <filename> logfile for Hexmod17.\n\t-hexmod_clean_log = <filename> logfile for Hexmod17 cleanup feature.\n\n\tsplit functionality for GS\n\t-core_exp=<filename> filename of the file list of the XML input data.\n\t-core_exp_xml=<filename> filename of merged XML input data.\n\t-in_t=<filename> filename of the template for output file [-in].\n\t-split_in=<filename> output file (i.e input_split.xml).\n\t-rule_t=<filename> filename of the template for output file [-rule].\n\t-split_rule=<filename> output file (i.e. rules_clean.xml).\n\t-out_t=<filename> filename of the template for output file [-out].\n\t-split_out=<filename> output file (i.e. output_split.xml).\n\t-hex_split_in=<filename> filename of input file to be split.\n\t-hex_split_out=<filename> filename of the output file by HexMod17 after split.\n\t-hex_split_range=<filename> text file containing ranges to be split.\n\t-hexmod_log = <filename> logfile for Hexmod17.\n\t-hex_split_log=<filename> logfile for HexMod17 split feature.\n\n\tsplit functionality for DS\n\t-core_exp=<filename> filename of the file list of the XML input data.\n\t-core_exp_xml=<filename> filename of merged XML input data.\n\t-in_t=<filename> filename of the template for output file [-in].\n\t-split_in=<filename> output file (i.e input_split.xml).\n\t-split_in_ref=<filename> output file (i.e input_split.xml).\n\t-rule_t=<filename> filename of the template for output file [-rule].\n\t-split_rule=<filename> output file (i.e. rules_clean.xml).\n\t-out_t=<filename> filename of the template for output file [-out].\n\t-split_out=<filename> output file (i.e. output_split.xml).\n\t-split_out_ref=<filename> output file (i.e. output_split.xml).\n\t-hex_split_in=<filename> filename of input file to be split.\n\t-hexmod_log = <filename> logfile for Hexmod17.\n\t-hex_split_log=<filename> logfile for HexMod17 split feature.\n\t-ref_hex=<filename> filename of the reference hex file.\n\t-info_blks=<filename> filename of the infoblocks list file.\n\t-hex_cmp_dir=<filename> directory path of hex_cmp directory.\n\n\tMo_chksum functionality\n\t-in_t=<filename>filename of the input template file\n\t-mo_chksum_in=<filename>output file(input_mo_chksum.xml)\n\t-out_t=<filename>filename of the output template file.\n\t-mo_chksum_out=<filename>output file(output_mo_chksum.xml)\n\t-mo_chksum_t=<filename>path of checksum template file\n\t-mo_chksum=<filename>output file(checksum.xml)\n\t-rule_t=<filename>filename of rules template file\n\t-mo_chksum_rule=<filename>output file (rules.xml)\n\t-map=<filename>filename of input project map file.\n\t-mo_config=<filename> filename of input header file\n\t-hex_mo_chksum_in=<filename> filename of input hex file\n\t-hex_mo_chksum_out=<filename> filename of output hex file to be generated by HexMod17.\n\t-hexmod_mo_chksum_log=<filename>filename of HexMod log file.\n\t-logfile=<filename>filename of ConfigHexMod log file\n\t-mo_addressRange=<filename>filename of text file containing address information.\n\t-compensation Flag to enable compensation feature in HexMod17\n\t-plv Flag specific to PLV PST.
